<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendar cita | Auto Dealer</title>
  <link rel="canonical" href="https://www.autodealer.com.co/autodealer-nuevo/#agendar" />
  <meta http-equiv="refresh" content="0;url=https://www.autodealer.com.co/autodealer-nuevo/#agendar" />
  <script>
    (function () {
      var host = location.hostname;
      var isLocal = /^(localhost|127\.0\.0\.1)$/i.test(host);
      var isProd = /autodealer\.com\.co$/i.test(host);
      var base = isLocal
        ? location.origin + "/"
        : isProd
          ? "https://www.autodealer.com.co/autodealer-nuevo/"
          : location.origin + location.pathname.replace(/agendar\/?.*$/i, "");
      location.replace(base.replace(/\/?$/, "/") + "#agendar");
    })();
  </script>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:2rem;text-align:center;color:#333">
    Te llevamos a agendar tu cita…
    <a href="https://www.autodealer.com.co/autodealer-nuevo/#agendar">Continuar</a>
  </p>
</body>
</html>
