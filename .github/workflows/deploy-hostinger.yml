# Despliega main → public_html/ (raíz del sitio en Hostinger)
#
# Secrets en GitHub → Settings → Secrets → Actions:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (cuenta FTP Hostinger)
#   FLOTA_SMTP_PASS                         (contraseña de servicio@autodealer.com.co)

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear flota-lead-secrets.php en la raíz del deploy
        env:
          FLOTA_SMTP_PASS: ${{ secrets.FLOTA_SMTP_PASS }}
        run: |
          if [ -z "$FLOTA_SMTP_PASS" ]; then
            echo "::error::Falta el secret FLOTA_SMTP_PASS en GitHub (contraseña del correo servicio@autodealer.com.co)"
            exit 1
          fi
          php -r '$p=getenv("FLOTA_SMTP_PASS"); file_put_contents("flota-lead-secrets.php","<?php\n".chr(36)."FLOTA_SMTP_PASS = ".var_export($p,true).";\n");'
          echo "flota-lead-secrets.php generado (no va a git, solo al FTP)."

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.cursor/**
            **/deploy-raiz-dominio/**
            DEPLOY-HOSTINGER.md
            HOSTINGER-GIT.md
            flota-lead-secrets.php.example
